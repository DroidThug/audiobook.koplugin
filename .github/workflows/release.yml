name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Piper downloads
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-armv7l-${{ hashFiles('package-for-kobo.sh') }}

      - name: Build bundle (espeak-ng + Piper)
        run: bash package-for-kobo.sh --with-piper

      - name: Verify bundle
        run: |
          echo "=== Lua files ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/*.lua
          echo ""
          echo "=== espeak-ng binary ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/espeak-ng/bin/
          echo ""
          echo "=== Piper binary + voice ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/piper/piper
          ls -la kobo-tts-bundle/audiobook.koplugin/piper/*.onnx
          echo ""
          echo "=== Total size ==="
          du -sh kobo-tts-bundle/audiobook.koplugin/

      - name: Create zip
        run: |
          cd kobo-tts-bundle
          zip -r ../audiobook-koplugin-${{ github.ref_name }}-kobo.zip audiobook.koplugin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: audiobook-koplugin-${{ github.ref_name }}-kobo.zip
          body: |
            ## Audiobook Read-Along ${{ github.ref_name }}

            **Download, unzip, and copy `audiobook.koplugin/` to your KOReader plugins directory. Restart KOReader.**

            ### Included
            - Plugin (all Lua files)
            - Bundled espeak-ng (cross-compiled for Kobo armv7l)
            - Bundled Piper neural TTS + en_US-lessac-medium voice

            ### Install paths
            | Platform | Path |
            |----------|------|
            | Kobo | `.adds/koreader/plugins/` |
            | Kindle | `koreader/plugins/` |
            | Linux | `~/.config/koreader/plugins/` |
            | Android | `/sdcard/koreader/plugins/` |

            See [README](https://github.com/${{ github.repository }}/blob/master/README.md) for full documentation.
